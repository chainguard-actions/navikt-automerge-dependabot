name: Test blackout periods
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: dependabot/npm_and_yarn/lodash-4.17.21
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: GITHUB_TOKEN
          blackout-periods: "Dec 24-Jan 5,Sat,Sun"
          semver-filter: patch,minor
        continue-on-error: true
      - name: Assert action completed with blackout-periods input
        env:
          MERGED: ${{ steps.action.outputs.merged-pr-count }}
        run: |
          echo "merged-pr-count: $MERGED"
          echo "PASS: action with blackout-periods completed"
