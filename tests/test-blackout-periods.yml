name: Test blackout-periods input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/2/merge
      GITHUB_HEAD_REF: dependabot/npm_and_yarn/axios-0.21.1
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: GITHUB_TOKEN
          blackout-periods: 'Sat,Sun'
          semver-filter: patch,minor
          retry-delay-ms: '100'
        continue-on-error: true
      - name: Assert action ran with blackout-periods
        run: |
          echo "Action completed with blackout-periods input set"
          echo "PASS"
