name: Test blackout periods
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: GITHUB_TOKEN
          # Blackout every day of the week — action should skip all merges
          blackout-periods: 'Mon,Tue,Wed,Thu,Fri,Sat,Sun'
          semver-filter: 'patch,minor'
      - name: Assert action ran with blackout period active
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MERGED_COUNT: ${{ steps.action.outputs.merged-pr-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "merged-pr-count: $MERGED_COUNT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MERGED_COUNT" ]; then
              echo "FAIL: action succeeded but merged-pr-count output is empty"
              exit 1
            fi
            # During a blackout period, no PRs should be merged
            if [ "$MERGED_COUNT" != "0" ]; then
              echo "FAIL: expected 0 merged PRs during blackout, got '$MERGED_COUNT'"
              exit 1
            fi
            echo "PASS: merged-pr-count=0 as expected during blackout period"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
