name: Test ignored-dependencies input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: GITHUB_TOKEN
          ignored-dependencies: 'lodash,axios'
          semver-filter: 'patch,minor'
      - name: Assert action ran with ignored-dependencies configured
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MERGED_COUNT: ${{ steps.action.outputs.merged-pr-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "merged-pr-count: $MERGED_COUNT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$MERGED_COUNT" ]; then
              echo "FAIL: action succeeded but merged-pr-count output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with ignored-dependencies, merged-pr-count=$MERGED_COUNT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
