name: Test missing token environment variable fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: '$DEFINITELY_NOT_SET_TOKEN_VAR'
          retry-delay-ms: '0'
      - name: Assert action failed and reported zero merges
        env:
          ACTUAL: ${{ steps.action.outputs.merged-pr-count }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "actual: $ACTUAL"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when token env var is missing"
            exit 1
          fi
          if [ "$ACTUAL" != "0" ]; then
            echo "FAIL: expected merged-pr-count '0'"
            exit 1
          fi
          echo "PASS"
