name: Test ignored-versions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: GITHUB_TOKEN
          ignored-versions: "lodash@4.17.21,axios@0.21.1"
          semver-filter: "patch,minor"
          merge-method: "merge"
      - name: Assert action ran with ignored-versions input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MERGED: ${{ steps.action.outputs.merged-pr-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "merged-pr-count: $MERGED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded, merged-pr-count=$MERGED"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or no Dependabot PRs)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
