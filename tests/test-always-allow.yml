name: Test always-allow input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: GITHUB_TOKEN
          always-allow: '*'
          semver-filter: 'patch,minor,major'
          merge-method: merge
          retry-delay-ms: '100'
      - name: Assert action ran with always-allow input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MERGED: ${{ steps.action.outputs.merged-pr-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "merged-pr-count: $MERGED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with always-allow='*'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
