name: Test blackout period
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: GITHUB_TOKEN
          blackout-periods: Mon,Tue,Wed,Thu,Fri,Sat,Sun
          semver-filter: patch,minor

      - name: Assert action ran during blackout period
        env:
          OUTCOME: ${{ steps.action.outcome }}
          MERGED_COUNT: ${{ steps.action.outputs.merged-pr-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "merged-pr-count: $MERGED_COUNT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded during blackout period (merged-pr-count='$MERGED_COUNT')"
            # During a blackout period covering all days, no PRs should be merged
            if [ -n "$MERGED_COUNT" ] && [ "$MERGED_COUNT" != "0" ]; then
              echo "FAIL: expected 0 merged PRs during blackout period, got '$MERGED_COUNT'"
              exit 1
            fi
            echo "PASS: merged-pr-count is 0 as expected during blackout"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
