name: Test advanced options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: dependabot/npm_and_yarn/axios-0.21.1
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: GITHUB_TOKEN
          minimum-age-of-pr: "1"
          merge-method: squash
          retry-delay-ms: "100"
          auto-approve: "false"
          semver-filter: patch
        continue-on-error: true
      - name: Assert action completed with advanced options
        env:
          MERGED: ${{ steps.action.outputs.merged-pr-count }}
        run: |
          echo "merged-pr-count: $MERGED"
          echo "PASS: action with advanced options completed"
